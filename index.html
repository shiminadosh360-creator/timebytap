<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display:flex;
            height: 100vh;
            box-sizing: border-box;
        }
        body > div {
            width: 33vw;  
        }
        table,tr,th,td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        table {
            min-width: 40vw;
        }
        iframe {
            display: inline;
        }
        .srt-container p:hover{
            background-color: rgba(0, 0, 0, 0.2);
        }
        tr:active {
            background-color: rgba(0, 0, 0, 0.2);
        }
        .karaoke-lines-container div div{
            display: flex;
            gap: 16px;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="srt-container">
        <div class="timer"></div>
        <button id="startTimer">start</button>
        <button id="timeStamp">timestamp</button>
    </div>
    <div>
        <button class="focus-start">Focus on start</button>
        <button class="stop-btn">Stop timer</button>
        <button class="rerun-subtitle-btn">Rerun last subtitle</button>
        <button class="speed-btn">Reduce speed to 0.5</button>
        <button class="remove-multiple-lines-btn">Remove multiple lines</button>
        <p class="current-caption"></p>
    </div>
    <div class="karaoke-lines-container">
        <div>
            <label for="line-num-input">Line Number</label>
            <input type="number" id="line-num-input" name="line-num-input" class="line-num-input" >
            <label for="lineInput">Line</label>
            <input type="text" id="lineInput" name="lineInput" class="lineInput">
            <button id="appendLineBtn" type="button">Add Line</button>
            <div>
                <textarea name="some" id="some" cols="20" rows="20"></textarea>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/GBwt04s3DwY?si=NSXv61uQ71Go3dBt" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
        <table>
            <tr>
                <th>הסר שורה</th>
                <th>תקן שורה</th>
                <th>שורות עם אינטרוולים</th>
                <th>שורות</th>
                <th>מספר שורה</th>
            </tr>
        </table>
    </div>
    <div class="lines-container">
        
    </div>
    <script>
        //https://youtu.be/d8-LGhKtzRw?si=8LwIS71R9n6ws68p timer
        let startTime = 0; // starting the timer 
        let timeStampTime = 0; // current time when the timeStampRun is called (timer "lap")
        let lineNum = 0; // current line's number (increased by one with every timeStamprun())
        let inlineNum = 0; // current position number inside a line (used for the karaoke intervals inside a caption)
        let currentCaption = '' // the caption content (only caption, without the timing and number of caption) of a single line (which get longer with every karaoke)
        let captionsArr = [] // an Array of all the former captions that were assigned to the srt section
        let karaokeInterim // the interim between every syllable in a single line
        let timeStampDisplay; // a string that contains a timer lap in the proper format of srt files.
        let hours;
        let minutes;
        let seconds;
        let milliseconds;
        let isFirstTimeStamp = true;
        let isEndofLine = false
        let pArray = []


        let isRunning = false
        let timer = null
        let elapsedTime = 0
        let karaokeInterimArr = []// ??????????????
        let timeStampTimeArr = []
        let isReRun = false
        function startTimer() {
            if (!isRunning){
	            if (isReRun && speed == 0.5) startTime = Date.now() - 2 * elapsedTime;
                else startTime = Date.now() - elapsedTime;
                timer = setInterval((() => timerUpdate(speed)), 10)
                isRunning = true
            }
        }
        function timeStampRun() {
            lastTimeStampTime = timeStampTime
            timeStampTime = elapsedTime;
            if (isReRun){
                isReRun = false
                return
            }
            if (isFirstTimeStamp){
                timeStampTimeArr.push(timeStampTime)
                isFirstTimeStamp = false
                if (linesArr[lineNum]) parCurrentCaption.textContent = linesArr[lineNum][inlineNum]
                return
            }            
            timeStampDisplay = getTimeStampDisplay(timeStampTime)
            let lastTimeStampDisplay = getTimeStampDisplay(timeStampTimeArr.at(-1))
            karaokeInterim = getKaraokeInterim(timeStampTime, lastTimeStampTime)
            if (linesArr[lineNum]){
                isEndofLine = linesArr[lineNum].length == inlineNum + 1 
                currentCaption += `{\\k${karaokeInterim}}${linesArr[lineNum][inlineNum]}`
                inlineNum += 1
                parCurrentCaption.textContent = linesArr[lineNum][inlineNum]

                if (isEndofLine){
                    lineNum += 1;
                    inlineNum = 0;
                    let pCurrent = document.createElement("p")
                    pArray.push(pCurrent)
                    srtContainer.appendChild(pCurrent)
                    pArray[lineNum - 1].classList.toggle(`p${lineNum}`)
                    // Add text to the current caption paragraph - completing this caption  
                    pArray[lineNum - 1].innerText += `${lineNum}\n${lastTimeStampDisplay} --> ${timeStampDisplay}\n${currentCaption}\n\n`
                    timeStampTimeArr.push(timeStampTime)
                    captionsArr.push(currentCaption) //Not sure I'll use it
                    currentCaption = ''
                    parCurrentCaption.textContent = linesArr[lineNum][inlineNum]


                    if (reRunNum) reRunNum = 0
                }

                
                         
            } else {
                lineNum += 1
                let pCurrent = document.createElement("p")
                pArray.push(pCurrent)
                srtContainer.appendChild(pCurrent)
                pArray[lineNum - 1].classList.toggle(`p${lineNum}`)
                pArray[lineNum - 1].innerText += `${lineNum}\n${lastTimeStampDisplay} --> ${timeStampDisplay}\nSubtitle text here\n\n`
                timeStampTimeArr.push(timeStampTime)
            }

            
        }
        function getTimeStampDisplay(someTime){
            hours = Math.floor( someTime / (1000 * 60 * 60)).toString();
            minutes = Math.floor( someTime / (1000 * 60) %60).toString();
            seconds = Math.floor( someTime / 1000 % 60).toString();
            milliseconds = Math.floor( someTime%1000).toString();
            if (hours.length === 1){
                hours = '0' + hours;
            }
            if (minutes.length === 1){
                minutes = '0' + minutes;
            }
            if (seconds.length === 1){
                seconds = '0' + seconds;
            }
            if (milliseconds.length === 1) {
                milliseconds = '00' + milliseconds;
            }
            if (milliseconds.length === 2) {
                milliseconds = '0' + milliseconds;
            }

            let timeStampDisplay = `${hours}:${minutes}:${seconds},${milliseconds}`;
            return timeStampDisplay
        }
        function stopTimer(speed = 1){
            if (isRunning){
                clearInterval(timer);
                elapsedTime = speed*(Date.now() - startTime)
                isRunning = false;
            }
        }
        function timerUpdate(speed = 1) {
            elapsedTime = speed*(Date.now() - startTime)
            let humanReadableTime = getTimeStampDisplay(elapsedTime)
            timerDisplay.textContent = humanReadableTime
        }
        function getKaraokeInterim(timeStampTime, lastTimeStampTime){
            //to make the interim compatible with aegisub's karaoke feature. they use 1/100 of a second for the karaoke interims.
            let karaokeInterim = (Math.round((timeStampTime - lastTimeStampTime)/10))
            karaokeInterimArr.push(karaokeInterim) // ?????????
            return karaokeInterim.toString()
        }
        let reRunNum = 0
        function reRunSubtitle() {
            if (!reRunNum){ 
                isReRun = true
                elapsedTime = timeStampTimeArr.at(-1)
                currentCaption = ''
                inlineNum = 0
                parCurrentCaption.textContent = linesArr[lineNum][inlineNum]
                let humanReadableTime = getTimeStampDisplay(elapsedTime)
                timerDisplay.textContent = humanReadableTime


                reRunNum = 1
            } else {
                reRunNum = reRunNum + 1
                lineNum = lineNum - 1
                inlineNum = 0
                isReRun = true
                timeStampTimeArr.pop()
                elapsedTime = timeStampTimeArr.at(-1)
                currentCaption = ''
                parCurrentCaption.textContent = linesArr[lineNum][inlineNum]
                let humanReadableTime = getTimeStampDisplay(elapsedTime)
                timerDisplay.textContent = humanReadableTime
                let pToRemove = document.querySelector(`.p${lineNum + 1}`)
                srtContainer.removeChild(pToRemove)

                pArray.pop()
                captionsArr.pop()
            }
        }


        //This doen't work as it it moves on to return without waiting for an event to occur. I'm not sure if using a loop will do the job.
        // Note so that I won't forget - It might be much more useful to add the subtitles after setting the timing of the srt subtitles (including the karaoke interims). that way one mistake won't harm the subtitles coming afterwards.
        //maybe create a huge array of karaoke interims and let the user insert the syllable in every interim
        //*maybe just use the original way (create karaoke interims and full subtitle at once), and give the user the opportunity to fix any timing issue by pausing, rewinding and creating a new subtitle. The user will know when a mistake happens by looking at the "current syllable" and noticing a difference between this and the the syllable sang in the video.*
        function selectLineToEdit() {
            srtContainer.addEventListener("click", (e) => {
                let selectedParClass
                let selectedParContent
                let selectedParObj
                console.log("hi")
                e.target.style.backgroundColor = "rgba(0, 0, 0, 0.2)"
                selectedParContent = e.target.value
                selectedParClass = e.target.classList
                selectedParObj= {
                    [selectedParClass] : selectedParContent,
                }
            })
            console.log(selectedParObj)
            return selectedParObj
        }

        const start = document.getElementById('startTimer');
        const timeStamp = document.getElementById('timeStamp');
        const p = document.querySelector('.captions')
        const appendLineBtn = document.querySelector('#appendLineBtn')

        const text = document.querySelector("textarea")
        const lineInput = document.querySelector('.lineInput')
        const lineNumInput = document.querySelector('.line-num-input')
        
        const table = document.querySelector('table')
        const parCurrentCaption = document.querySelector('.current-caption')
        const focusStartBtn = document.querySelector('.focus-start')
        const srtContainer = document.querySelector('.srt-container')
        const timerDisplay = document.querySelector('.timer')
        const stopBtn = document.querySelector('.stop-btn')
        const reRunSubtitleBtn = document.querySelector('.rerun-subtitle-btn')
        const speedBtn = document.querySelector(".speed-btn")
        const removeMultipleLinesBtn = document.querySelector(".remove-multiple-lines-btn")
        let currentLineArr
        let linesArr = [] // an array (of arrays) of all of the captions that were provided by the user, in the 
        let currentLineArrNoSpaces
        let linesArrNoSpaces = []
        let arrSplitBySpaces = []
        let tableLineNum = 0
        let tdReferncesArr = [] /*פה עצרת, רצית לבנות תא לכל שורה בטבלה ולשמור את הרפרנסים כרשימה*/
        let infoArr = []
        let tdClasses = ["karaoke-line", "regular-line", "line-num"]
        let stringWithCorrectCommaDot = ""

        appendLineBtn.addEventListener("click", (e) => {
            if (!(text.value) == '') {
                let textAreaList = (text.value).split(/\r?\n/)
                for (let item of textAreaList){
                    if (lineNumInput.value && (!(lineNumInput.value > infoArr.length))) {
                        addLyricsToLinesArr(item, lineNumInput.value, true)
                    } else {
                        addLyricsToLinesArr(item, infoArr.length + 1)
                    }                    
                }
            } else if (!(lineInput.value) == ''){
                if (lineNumInput.value && (!(lineNumInput.value > infoArr.length))) {
                    addLyricsToLinesArr(lineInput.value, lineNumInput.value, true)
                } else {
                    addLyricsToLinesArr(lineInput.value, infoArr.length + 1)
                }
            } 
            addLyricsToTable()
            text.value = ""
            lineInput.value = ""
            lineNumInput.value = ""
        })
        

        function addLyricsToLinesArr(lineText, lineNum, push){
            if (!(lineText == '')) {
                if ((lineText).includes(" ") || (lineText).includes(";")){
                    //To add a karaoke break with every space without removing spaces
                    arrSplitBySpaces = (lineText).split(" ")
                    for (let i=1; i < arrSplitBySpaces.length; i++){
                        arrSplitBySpaces[i] = " ;" + arrSplitBySpaces[i]
                    }
                    stringWithCorrectCommaDot = arrSplitBySpaces.join("")
                    currentLineArr = stringWithCorrectCommaDot.split(";")
                } else {
                    currentLineArr = [lineText]
                }
                if (push) linesArr.splice(lineNum - 1, 0, currentLineArr)
                else linesArr[lineNum-1] = currentLineArr
                let currentTdsObj = {
                    karLine: lineText,
                    regLine: `${currentLineArr.join("")}`,
                    lineNum: `${lineNum}`
                }
                if (push) infoArr.splice(lineNum - 1, 0, currentTdsObj)
                else infoArr[lineNum-1] = currentTdsObj
            }
        }

        function addLyricsToTable(){
            if (table.querySelectorAll(".table-line")) {
                const lines = table.querySelectorAll(".table-line")
                lines.forEach(element => {
                    table.removeChild(element)
                });
            }
            for (let index = 0; index < infoArr.length; index++) {
                let currentTr = document.createElement("tr")
                currentTr.classList.toggle("table-line")
                table.appendChild(currentTr)
                infoArr[index].lineNum = index + 1
                for (let i of ["remove", "fix"]){
                    let currentTd = document.createElement("td")
                    currentTd.textContent = i
                    currentTr.appendChild(currentTd)
                }
                let i = 0
                for (let key in infoArr[0]){
                    let currentTd = document.createElement("td")
                    currentTd.classList.toggle(`${tdClasses[i]}`)
                    i++
                    //tableLineNum starts with 1, but array index starts with 0, so I subtracted tableLineNum by 1 to get the proper index.
                    currentTd.textContent = infoArr[index][key]
                    currentTr.appendChild(currentTd)
                }
            }
        }

        function removeLines(lineNum1, lineNum2 = lineNum1) {
            if (!linesArr[lineNum1 - 1] || !linesArr[lineNum2 - 1]){
                alert("line number not found")
                return
            }
            let d = null
            if (+lineNum1 > +lineNum2){
                d = +lineNum1 - +lineNum2
            } else {
                d = +lineNum2 - +lineNum1
            }
            linesArr.splice(lineNum1-1, d + 1)
            infoArr.splice(lineNum1-1, d + 1)
        }
        
        let speed = 1
        speedBtn.addEventListener("click", () => {
            if (speed == 1){
                speed = 0.5
                speedBtn.textContent = "Increase speed to normal"
            } else {
                speed = 1
                speedBtn.textContent = "Reduce speed to 0.5"
            }
        })
        start.addEventListener("click", () => {
            startTimer(speed)
            if (isReRun){
                timeStampRun()
                isReRun = false
            }
            timeStamp.focus()
            return
        });
        timeStamp.addEventListener("click", timeStampRun);
        focusStartBtn.addEventListener('click', () => {
            start.focus() 
        })
        stopBtn.addEventListener('click', () => {
            stopTimer(speed)
        })
        reRunSubtitleBtn.addEventListener('click', () => {
            reRunSubtitle()
            start.focus()
        })
        removeMultipleLinesBtn.addEventListener("click", () => {
            const lineNum1 = prompt("remove from line number:")
            const lineNum2 = prompt("remove until line number:")
            removeLines(lineNum1, lineNum2)
            addLyricsToTable()
        })



        table.addEventListener("dblclick", (e) => {
            if (e.target.textContent == "fix") {
                const lineNum = +e.target.parentElement.lastElementChild.textContent
                const fixedLine = prompt("change line?", `${infoArr[lineNum-1].karLine}`)
                addLyricsToLinesArr(fixedLine, lineNum)
                addLyricsToTable()                
            }
            if (e.target.textContent == "remove") {
                const lineNum = +e.target.parentElement.lastElementChild.textContent
                if (confirm(`Are you sure you want to remove line number ${lineNum}?`)){
                    removeLines(lineNum)
                    addLyricsToTable()
                }
            }            
        })


    </script>
</body>
</html>
